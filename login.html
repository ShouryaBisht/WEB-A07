<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>

<body>

    <h1>Login Page</h1>

    <form action="about.html">

        <label>Username:</label>
        <input type="text"
               minlength="3"
               maxlength="15"
               placeholder="Enter username"
               required>
        <br><br>

        <label>Password:</label>
        <input type="password"
               minlength="8"
               maxlength="20"
               placeholder="Enter password"
               title="Password must contain 8 to 20 characters"
               required>
        <br><br>

        <input type="submit" value="Login" href="about.html">

    </form>

</body>
</html>
