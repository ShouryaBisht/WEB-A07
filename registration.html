<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
</head>

<body>

    <h1>Registration Page</h1>

    <form action="login.html">

        <label>Name:</label>
        <input type="text" placeholder="Enter your name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>
        <br><br>

        <label title="password must contain 8-20 characters">Password:</label>
        <input type="password" minlength="8" maxlength="20"
               placeholder="Enter your password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Upload File:</label>
        <input type="file">
        <br><br>

        <label>Subjects:</label>
        <br>
        <input type="checkbox" name="subject" value="maths"> Mathematics
        <br>
        <input type="checkbox" name="subject" value="physics"> Physics
        <br>
        <input type="checkbox" name="subject" value="chemistry"> Chemistry
        <br>
        <input type="checkbox" name="subject" value="english"> English
        <br><br>

        <button type="submit" value="Register" href="login.html">Register</button>

    </form>

</body>
</html>
